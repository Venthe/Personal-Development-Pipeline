# TODO: Use autogenerated temp directory
- name: Generate join command
  become: true
  register: join_command
  ansible.builtin.command: kubeadm token create --print-join-command

- name: Save join command
  ansible.builtin.copy:
    content: "{{ join_command.stdout }}"
    dest: "/tmp/join-command"

- name: Archive Kubernetes config/pki for replication
  become: true
  ansible.builtin.archive:
    path:
      - /tmp/join-command
      - /etc/kubernetes/pki/ca.crt
      - /etc/kubernetes/pki/ca.key
      - /etc/kubernetes/pki/front-proxy-ca.crt
      - /etc/kubernetes/pki/front-proxy-ca.key
      - /etc/kubernetes/pki/sa.key
      - /etc/kubernetes/pki/sa.pub
      - /etc/kubernetes/pki/etcd/ca.crt
      - /etc/kubernetes/pki/etcd/ca.key
      - /etc/kubernetes/admin.conf
      - /var/lib/kubelet/config.yaml
    dest: /tmp/{{ join_configuration_filename }}
    format: gz

- name: Fetch Kubernetes config archive from remote node
  become: true
  ansible.builtin.fetch:
    src: /tmp/{{ join_configuration_filename }}
    dest: '{{ join_configuration_directory }}'
    flat: true

- ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  with_items:
    - "/tmp/join-command"
    - /tmp/{{ join_configuration_filename }}