- name: Install packages that allow apt to be used over HTTPS
  become: true
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
    update_cache: true
  vars:
    packages:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common

- name: Add docker repo using key from URL.
  become: true
  ansible.builtin.deb822_repository:
    name: "docker"
    types: [deb]
    uris: "https://download.docker.com/linux/ubuntu"
    components: [stable]
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present
    suites: [plucky]
    enabled: true

- name: Install containerd
  become: true
  ansible.builtin.apt:
    name: "containerd={{ containerd_version }}"
    state: present
    update_cache: true

- name: Create directory for containerd configuration
  become: true
  ansible.builtin.file:
    mode: '0755'
    path: /etc/containerd/
    state: directory

- name: Prepare default containerd configuration
  ansible.builtin.command: containerd config default
  register: default_containerd_config

- name: Save containerd configuration
  become: true
  ansible.builtin.copy:
    mode: '0755'
    content: "{{ default_containerd_config.stdout_lines | join('\n') }}"
    dest: /etc/containerd/config.toml


- name: Set containerd configuration
  become: true
  ansible.builtin.lineinfile:
    path: /etc/containerd/config.toml
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    backrefs: yes
  with_items:
    - regexp: '^(disabled_plugins\s*=\s*\[s*)(\"cri\")(\s*\])$'
      line: '\1\3'
    - regexp: '^(\s*config_path)\s*=\s*.*$'
      line: '\1 = "/etc/containerd/certs.d"'
    - regexp: '^(\s*SystemdCgroup)\s*=\s*.*$'
      line: \1 = true

- name: Restart containerd
  become: true
  ansible.builtin.service:
    enabled: true
    name: containerd
    state: restarted
