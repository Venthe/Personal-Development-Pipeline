- name: Check if crictl is installed and version matches
  ansible.builtin.command: crictl -v
  register: crictl_version_check
  ignore_errors: yes
  changed_when: false

- name: Set fact if crictl needs install/update
  ansible.builtin.set_fact:
    crictl_needs_install: "{{ (crictl_version_check.failed) or (crictl_version not in crictl_version_check.stdout) }}"

- name: Download crictl archive
  ansible.builtin.get_url:
    url: "https://github.com/kubernetes-sigs/cri-tools/releases/download/{{ crictl_version }}/crictl-{{ crictl_version }}-linux-amd64.tar.gz"
    dest: "/tmp/crictl-{{ crictl_version }}-linux-amd64.tar.gz"
    mode: '0644'
  when: crictl_needs_install

- name: Extract crictl to /usr/local/bin
  become: true
  ansible.builtin.unarchive:
    src: "/tmp/crictl-{{ crictl_version }}-linux-amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: yes
    mode: '0755'
  when: crictl_needs_install

- name: Remove crictl archive
  ansible.builtin.file:
    path: "/tmp/crictl-{{ crictl_version }}-linux-amd64.tar.gz"
    state: absent
  when: crictl_needs_install

- name: Configure crictl to use containerd
  become: true
  ansible.builtin.copy:
    mode: '0644'
    dest: "/etc/crictl.yaml"
    content: |
      runtime-endpoint: unix:///var/run/containerd/containerd.sock
      image-endpoint: unix:///var/run/containerd/containerd.sock
      timeout: 10
      debug: false

- name: Create containerd group
  become: true
  ansible.builtin.group:
    name: containerd
    state: present


- name: Change group ownership of containerd socket
  become: true
  ansible.builtin.file:
    path: /var/run/containerd/containerd.sock
    group: containerd
    state: file
    recurse: no


- name: Add user to containerd group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_ssh_user }}"
    groups: containerd
    append: yes