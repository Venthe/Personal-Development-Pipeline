- name: Add Kubernetes repo using key from URL.
  become: true
  ansible.builtin.deb822_repository:
    name: "kubernetes"
    types: [deb]
    uris: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/"
    components: ""
    signed_by: https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key
    state: present
    suites: "/"
    enabled: true

- name: Install Kubernetes binaries
  become: true
  apt:
    name: "{{ packages }}"
    state: present
    update_cache: true
  vars:
    packages:
      - "kubeadm={{ kubernetes_apt_version }}"
      - "kubelet={{ kubernetes_apt_version }}"
      - "kubectl={{ kubernetes_apt_version }}"

- name: APT Hold kebernetes packages
  become: true
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  with_items:
    - kubeadm
    - kubelet
    - kubectl

# TODO: Verify audit logs
- name: Create a directory if it does not exist
  when: 'false'
  file:
    mode: '0644'
    owner: 'root'
    path: "{{ item }}"
    state: directory
  with_items:
    - /var/log/kubernetes/audit
    - /etc/kubernetes

- name: Set up audit policy
  when: 'false'
  copy:
    mode: '0644'
    owner: 'root'
    dest: "/etc/kubernetes/audit-policy.yaml"
    content: |
      apiVersion: audit.k8s.io/v1beta1
      kind: Policy
      rules:
      - level: Metadata