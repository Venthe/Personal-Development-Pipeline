- name: Add ArgoCD repository
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm

- name: Deploy ArgoCD chart
  kubernetes.core.helm:
    create_namespace: true
    update_repo_cache: true
    name: argocd
    chart_ref: argo/argo-cd
    release_namespace: "{{ infrastructure_namespace }}"
    values: "{{ lookup('template', './argocd.yml') | from_yaml }}"

- name: Set pregenerated password
  ansible.builtin.set_fact:
    bcrypt_pwd: "{{ argocd_hashed_password }}"

- name: Get current timestamp
  ansible.builtin.command: date +%FT%T%Z
  register: timestamp

- name: Patch ArgoCD password
  ansible.builtin.command: >
    kubectl --namespace {{ infrastructure_namespace }} patch secret argocd-secret
    -p '{{ payload }}'
  vars:
    payload: >
      {{
        {
          "stringData": {
            "admin.password": bcrypt_pwd,
            "admin.passwordMtime": timestamp.stdout
          }
        } | to_json
      }}

- name: Create ArgoCD repo secret
  k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitea-repo-credentials
        namespace: "{{ infrastructure_namespace }}"
        labels:
          bootstrap: 'true'
          argocd.argoproj.io/secret-type: repository
      stringData:
        type: git
        url: gitea-http.service
        username: admin
        password: secret

- name: Create ArgoCD app-of-apps
  k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: ApplicationSet
      metadata:
        name: root
        namespace: "{{ infrastructure_namespace }}"
      spec:
        goTemplate: true
        goTemplateOptions: ["missingkey=error"]
        generators:
          - matrix:
              generators:
                - git:
                    repoURL: http://gitea-http.service/admin/infrastructure.git
                    revision: HEAD
                    files:
                      - path: "configuration/**/config.json"
                - list:
                    elements:
                    - dummy: ''
        templatePatch: |
          spec:
            sources:
              - chart: '{{ "{{ .chart }}" }}'
                repoURL: '{{ "{{ .repoURL }}" }}'
                targetRevision: {{ "{{ .targetRevision }}" }}
                helm:
                  releaseName: {{ "{{ .name }}" }}
          {{ "{{- if .valueFiles }}" }}
                  valueFiles:
          {{ "{{- range .valueFiles }}" }}
                  - {{ "{{ . }}" }}
          {{ "{{- end }}" }}
          {{ "{{- end }}" }}
              - repoURL: http://gitea-http.service/admin/infrastructure.git
                targetRevision: HEAD
                ref: values
        template:
          metadata:
            name: '{{ "{{ .name }}" }}'
            namespace: "{{ infrastructure_namespace }}"
          spec:
            project: default
            destination:
              server: https://kubernetes.default.svc
              namespace: '{{ "{{ .namespace }}" }}'
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
      