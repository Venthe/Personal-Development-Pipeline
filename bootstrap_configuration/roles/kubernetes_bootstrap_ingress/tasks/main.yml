- kubernetes.core.helm_repository:
    name: "{{ ingress_repository_name }}"
    repo_url: "{{ ingress_repository_url }}"

- name: Install ingress
  kubernetes.core.helm:
    update_repo_cache: true
    name: "{{ ingress_deployment_name }}"
    create_namespace: true
    chart_ref: "{{ ingress_repository_name }}/ingress-nginx"
    release_namespace: "{{ ingress_namespace }}"

- name: Instructions
  ansible.builtin.debug:
    msg: |
      To use, add the annotation to ingress
        kubernetes.io/ingress.class: nginx
        external-dns.alpha.kubernetes.io/hostname: "{{ cluster_domain }}"
